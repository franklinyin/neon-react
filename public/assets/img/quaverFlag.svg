<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -875 566 1007">
  <!--
    Quarter note as Verovio draws it, then an 8th flag on that stem.
    Leipzig E0A4 noteheadBlack. 1 staff space = 250. stemUpSE = (1.26, 0.16) spaces.
    Up-stem x = stemUpSE.x - stemWidth/2, stroke centered (right edge flush with head).
    Stem length = 7 units (3.5 spaces) from note center. Flag at stem tip, x - stemWidth/2.
  -->
  <g transform="scale(1,-1)" fill="#000">
    <g id="quarter-note">
      <path
        d="M0 -39c0 68 73 172 200 172c66 0 114 -37 114 -95c0 -84 -106 -171 -218 -171c-64 0 -96 30 -96 94z"
      />
      <path
        d="M302.5 40 L302.5 875"
        fill="none"
        stroke="#000"
        stroke-width="25"
        stroke-linecap="butt"
      />
    </g>
    <g id="flag" transform="translate(290 875)">
      <path d="M179 -646c15 29 29 55 46 102c18 49 30 108 30 138c0 105 -80 173 -168 200c-18 5 -47 9 -87 16v190h22c8 0 33 -61 71 -95c4 -3 -2 3 61 -56c62 -58 122 -137 122 -241c0 -38 -13 -106 -35 -163c-20 -51 -43 -99 -66 -132c-6 -5 -10 -7 -13 -7s-5 2 -5 5l4 10c1 3 14 25 18 33z" />
    </g>
  </g>
</svg>
